name: Deploy BeamMP Server

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Join Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_CI_AUTHKEY }}
          hostname: github-actions-beammp
          version: latest
          ping: ${{ secrets.DEPLOY_HOST }}

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Add target host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy deploy script
        run: |
          scp deploy/sync-and-run.sh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/beammp-sync-and-run.sh"

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          REPO_URL: ${{ secrets.REPO_URL }}
          APP_DIR: ${{ secrets.APP_DIR }}
          BRANCH: main
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          TS_HOSTNAME: ${{ secrets.TS_HOSTNAME }}
          BEAMMP_AUTH_KEY: ${{ secrets.BEAMMP_AUTH_KEY }}
          BEAMMP_NAME: ${{ secrets.BEAMMP_NAME }}
          BEAMMP_DESCRIPTION: ${{ secrets.BEAMMP_DESCRIPTION }}
          BEAMMP_PRIVATE: ${{ secrets.BEAMMP_PRIVATE }}
          BEAMMP_PORT: ${{ secrets.BEAMMP_PORT }}
          BEAMMP_MAP: ${{ secrets.BEAMMP_MAP }}
          BEAMMP_MAX_PLAYERS: ${{ secrets.BEAMMP_MAX_PLAYERS }}
          BEAMMP_MAX_CARS: ${{ secrets.BEAMMP_MAX_CARS }}
          BEAMMP_TAGS: ${{ secrets.BEAMMP_TAGS }}
          BEAMMP_ALLOW_GUESTS: ${{ secrets.BEAMMP_ALLOW_GUESTS }}
          BEAMMP_LOG_CHAT: ${{ secrets.BEAMMP_LOG_CHAT }}
          BEAMMP_VERSION: ${{ secrets.BEAMMP_VERSION }}
          BEAMMP_ASSET: ${{ secrets.BEAMMP_ASSET }}
        run: |
          {
            printf "export REPO_URL=%q\n" "$REPO_URL"
            printf "export APP_DIR=%q\n" "$APP_DIR"
            printf "export BRANCH=%q\n" "$BRANCH"
            printf "export TS_AUTHKEY=%q\n" "$TS_AUTHKEY"
            printf "export TS_HOSTNAME=%q\n" "$TS_HOSTNAME"
            printf "export BEAMMP_AUTH_KEY=%q\n" "$BEAMMP_AUTH_KEY"
            printf "export BEAMMP_NAME=%q\n" "$BEAMMP_NAME"
            printf "export BEAMMP_DESCRIPTION=%q\n" "$BEAMMP_DESCRIPTION"
            printf "export BEAMMP_PRIVATE=%q\n" "$BEAMMP_PRIVATE"
            printf "export BEAMMP_PORT=%q\n" "$BEAMMP_PORT"
            printf "export BEAMMP_MAP=%q\n" "$BEAMMP_MAP"
            printf "export BEAMMP_MAX_PLAYERS=%q\n" "$BEAMMP_MAX_PLAYERS"
            printf "export BEAMMP_MAX_CARS=%q\n" "$BEAMMP_MAX_CARS"
            printf "export BEAMMP_TAGS=%q\n" "$BEAMMP_TAGS"
            printf "export BEAMMP_ALLOW_GUESTS=%q\n" "$BEAMMP_ALLOW_GUESTS"
            printf "export BEAMMP_LOG_CHAT=%q\n" "$BEAMMP_LOG_CHAT"
            printf "export BEAMMP_VERSION=%q\n" "$BEAMMP_VERSION"
            printf "export BEAMMP_ASSET=%q\n" "$BEAMMP_ASSET"
            printf "bash /tmp/beammp-sync-and-run.sh\n"
          } | ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -se'
