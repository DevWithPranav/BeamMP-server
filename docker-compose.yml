services:
  tailscale:
    image: tailscale/tailscale:stable
    hostname: ${TS_HOSTNAME:-beammp-server}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_EXTRA_ARGS: --accept-routes=false --ssh
      # --port (a tailscaled daemon flag, so it goes via
      # TS_TAILSCALED_EXTRA_ARGS, not TS_EXTRA_ARGS which is for `tailscale
      # up`) pins this node's direct-connection UDP port. It can't share
      # 41641 with the host's own native tailscaled (from
      # scripts/bootstrap-ubuntu.sh, used for SSH access to the host itself)
      # - both are separate tailnet nodes needing separate host-bound ports.
      TS_TAILSCALED_EXTRA_ARGS: --port=41642
    ports:
      - "41642:41642/udp"
    volumes:
      - tailscale-state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "tailscale", "status", "--json"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 64M

  beammp:
    build:
      context: .
      args:
        BEAMMP_VERSION: ${BEAMMP_VERSION:-v3.9.3}
        BEAMMP_ASSET: ${BEAMMP_ASSET:-BeamMP-Server.ubuntu.24.04.x86_64}
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_healthy
    environment:
      BEAMMP_AUTH_KEY: ${BEAMMP_AUTH_KEY}
      BEAMMP_PRIVATE: ${BEAMMP_PRIVATE:-true}
      BEAMMP_NAME: ${BEAMMP_NAME:-Private BeamMP Server}
      BEAMMP_DESCRIPTION: ${BEAMMP_DESCRIPTION:-BeamMP server over Tailscale}
      BEAMMP_PORT: ${BEAMMP_PORT:-30814}
      BEAMMP_MAP: ${BEAMMP_MAP:-/levels/gridmap_v2/info.json}
      BEAMMP_MAX_PLAYERS: ${BEAMMP_MAX_PLAYERS:-8}
      BEAMMP_MAX_CARS: ${BEAMMP_MAX_CARS:-2}
      BEAMMP_TAGS: ${BEAMMP_TAGS:-Freeroam,Private}
      BEAMMP_ALLOW_GUESTS: ${BEAMMP_ALLOW_GUESTS:-true}
      BEAMMP_LOG_CHAT: ${BEAMMP_LOG_CHAT:-false}
      BEAMMP_RESOURCE_FOLDER: ${BEAMMP_RESOURCE_FOLDER:-Resources}
      # Scheduling priority for BeamMP-Server (-20 highest .. 19 lowest).
      BEAMMP_NICE: ${BEAMMP_NICE:--5}
      # Read by the ServerTools Lua plugin (Resources/Server/ServerTools).
      BEAMMP_ADMINS: ${BEAMMP_ADMINS:-}
      BEAMMP_WELCOME: ${BEAMMP_WELCOME:-Welcome! Type /help for commands.}
      BEAMMP_STATS_INTERVAL: ${BEAMMP_STATS_INTERVAL:-60}
    volumes:
      - ./beammp-data:/srv/beammp
    # Scratch space in RAM instead of the container's overlay filesystem.
    tmpfs:
      - /tmp:size=64m,mode=1777
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # Make the kernel's OOM killer pick almost anything else on the host
    # before the game server.
    oom_score_adj: -500
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The container briefly runs its entrypoint as root to `chown` the
    # bind-mounted volume and switch to the unprivileged `beammp` user
    # (see scripts/entrypoint.sh) before ever executing BeamMP-Server -
    # that setup step needs these back. Dropping to a non-root uid via
    # setuid() clears the process's capability sets regardless of what's
    # in the bounding set, so the actual long-running server process still
    # ends up with none of these (verify with `docker exec ... cat
    # /proc/<beammp-server-pid>/status | grep Cap`).
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETUID
      - SETGID
      - SETPCAP
      # Only used by the entrypoint to renice the server before the drop.
      - SYS_NICE
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 4.5G
          cpus: "3.5"
          pids: 512
        reservations:
          cpus: "1.0"
          memory: 256M

  # Optional: posts a Discord message when `beammp` or `tailscale` die,
  # restart, or flip (un)healthy. Not started by default - enable with
  # `docker compose --profile monitoring up -d`. This container is granted
  # read-only access to the Docker socket, which is itself a meaningful
  # privilege (anyone who can reach it can inspect every container on the
  # host), so only enable it if you're comfortable with that trade-off.
  monitor:
    image: docker:27-cli
    profiles:
      - monitoring
    environment:
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./scripts/watch-events.sh:/watch-events.sh:ro
    entrypoint: ["/bin/sh", "/watch-events.sh"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # Optional (same `monitoring` profile): samples CPU/RAM/network of both
  # containers plus the player count logged by the ServerTools plugin,
  # appends it to ./metrics/stats.csv, and posts a periodic Discord summary.
  stats:
    image: docker:27-cli
    profiles:
      - monitoring
    environment:
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      STATS_SAMPLE_SECONDS: ${STATS_SAMPLE_SECONDS:-60}
      STATS_REPORT_MINUTES: ${STATS_REPORT_MINUTES:-60}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./scripts/stats-reporter.sh:/stats-reporter.sh:ro
      - ./metrics:/metrics
    entrypoint: ["/bin/sh", "/stats-reporter.sh"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  tailscale-state:
