services:
  tailscale:
    image: tailscale/tailscale:stable
    hostname: ${TS_HOSTNAME:-beammp-server}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_EXTRA_ARGS: --accept-routes=false --ssh
    volumes:
      - tailscale-state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "tailscale", "status", "--json"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 64M

  beammp:
    build:
      context: .
      args:
        BEAMMP_VERSION: ${BEAMMP_VERSION:-v3.9.3}
        BEAMMP_ASSET: ${BEAMMP_ASSET:-BeamMP-Server.ubuntu.24.04.x86_64}
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_healthy
    environment:
      BEAMMP_AUTH_KEY: ${BEAMMP_AUTH_KEY}
      BEAMMP_PRIVATE: ${BEAMMP_PRIVATE:-true}
      BEAMMP_NAME: ${BEAMMP_NAME:-Private BeamMP Server}
      BEAMMP_DESCRIPTION: ${BEAMMP_DESCRIPTION:-BeamMP server over Tailscale}
      BEAMMP_PORT: ${BEAMMP_PORT:-30814}
      BEAMMP_MAP: ${BEAMMP_MAP:-/levels/gridmap_v2/info.json}
      BEAMMP_MAX_PLAYERS: ${BEAMMP_MAX_PLAYERS:-8}
      BEAMMP_MAX_CARS: ${BEAMMP_MAX_CARS:-2}
      BEAMMP_TAGS: ${BEAMMP_TAGS:-Freeroam,Private}
      BEAMMP_ALLOW_GUESTS: ${BEAMMP_ALLOW_GUESTS:-true}
      BEAMMP_LOG_CHAT: ${BEAMMP_LOG_CHAT:-false}
      BEAMMP_RESOURCE_FOLDER: ${BEAMMP_RESOURCE_FOLDER:-Resources}
    volumes:
      - ./beammp-data:/srv/beammp
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1536M
          pids: 512
        reservations:
          cpus: "1.0"
          memory: 256M

  # Optional: posts a Discord message when `beammp` or `tailscale` die,
  # restart, or flip (un)healthy. Not started by default - enable with
  # `docker compose --profile monitoring up -d`. This container is granted
  # read-only access to the Docker socket, which is itself a meaningful
  # privilege (anyone who can reach it can inspect every container on the
  # host), so only enable it if you're comfortable with that trade-off.
  monitor:
    image: docker:27-cli
    profiles:
      - monitoring
    environment:
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./scripts/watch-events.sh:/watch-events.sh:ro
    entrypoint: ["/bin/sh", "/watch-events.sh"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  tailscale-state:
